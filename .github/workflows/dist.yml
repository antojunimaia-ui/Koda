name: Release Koda-AI
 
on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)
    branches:
      - main # Also trigger on push to main (optional: for pre-releases)
 
jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
 
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4
 
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
 
      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
 
      - name: Install dependencies
        run: npm install
 
      - name: Build Vite App
        if: matrix.os == 'windows-latest'
        run: npm run build

      - name: Clean dist-electron before x64 build
        if: matrix.os == 'windows-latest'
        run: Remove-Item -Recurse -Force dist-electron -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Build Windows x64
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish never

      - name: Rename x64 artifacts
        if: matrix.os == 'windows-latest'
        run: |
          if (Test-Path "release-build/*.exe") {
            Get-ChildItem release-build/*.exe | ForEach-Object {
              $newName = $_.Name -replace '\.exe$', '-x64.exe'
              Move-Item $_.FullName "release-build/$newName" -Force
            }
          }
        shell: pwsh

      - name: Clean dist-electron before ia32 build
        if: matrix.os == 'windows-latest'
        run: Remove-Item -Recurse -Force dist-electron -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Build Windows ia32
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --ia32 --publish never

      - name: Rename ia32 artifacts
        if: matrix.os == 'windows-latest'
        run: |
          if (Test-Path "release-build/*.exe") {
            Get-ChildItem release-build/*.exe | Where-Object { $_.Name -notmatch '-x64\.exe$' } | ForEach-Object {
              $newName = $_.Name -replace '\.exe$', '-ia32.exe'
              Move-Item $_.FullName "release-build/$newName" -Force
            }
          }
        shell: pwsh

      - name: List Windows Build Artifacts
        if: matrix.os == 'windows-latest'
        run: |
          echo "Listing all generated files:"
          dir release-build
        shell: pwsh

      - name: Upload Windows x64 Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: koda-windows-x64
          path: release-build/*-x64.exe
          retention-days: 7

      - name: Upload Windows ia32 Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: koda-windows-ia32
          path: release-build/*-ia32.exe
          retention-days: 7

      - name: Publish Windows Builds to GitHub Release
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} release-build/*.exe --clobber
        shell: pwsh

      - name: Build and Publish (Linux/macOS)
        if: matrix.os != 'windows-latest'
        uses: samuelmeuli/action-electron-builder@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}
          max_attempts: 3

      - name: Upload Artifacts (Linux/macOS)
        uses: actions/upload-artifact@v4
        if: matrix.os != 'windows-latest'
        with:
          name: koda-${{ matrix.os }}-build
          path: |
            release-build/*.dmg
            release-build/*.AppImage
            release-build/*.zip
          retention-days: 7
